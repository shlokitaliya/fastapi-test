<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>API Tester</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-400 text-white flex flex-col justify-center items-center">
  <h1 class="text-xl font-bold mb-4">Create a DB Entry</h1>

  <form action="#" method="POST" id="form" class="border-2 grid grid-flow-row gap-4 p-4 w-96 bg-white text-black rounded">
    
    
    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Name" class="p-1 border rounded" required autofocus>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="4" placeholder="Description" required class="p-1 border rounded"></textarea>

    <label for="price">Price</label>
    <input type="number" id="price" name="price" placeholder="Price" class="p-1 border rounded" min="0" required>
    <p id="error-message" class="text-red-500"></p>
    <button type="submit" class="bg-blue-500 text-white px-3 py-1 rounded mt-2">Submit</button>
  </form>

<div class="w-[500px] h-[500px] border-1 bg-slate-50 m-[10px] p-[10px]">

</div>
  
</body>
<script src="./app.js"></script>
</html>
